version: "2"

run:
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - unconvert
  settings:
    misspell:
      locale: US # specs use American spelling (canceled, authorized)
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
          msg: use log/slog; stdout printing can leak payment data
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: strict
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/zoiko/zoikopay
